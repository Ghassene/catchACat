name: Appli Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Construire l'APK de test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Copier le jeu dans l'appli
        run: npm run sync

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk attrape-minou.apk

      - uses: actions/upload-artifact@v4
        with:
          name: attrape-minou-apk
          path: attrape-minou.apk
          retention-days: 30
